<!doctype html><html><head><meta charset="utf-8"><style>

.sq{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;overflow:hidden;
 background:radial-gradient(circle at 3px 3px,rgba(0,0,0,.22) 2.6px,transparent 3.4px) 0 0/16px 16px,linear-gradient(160deg,#ff2a3d,#e5001c 45%,#9c0012);

.p{left:120px;top:250px;font:900 420px/1 "Bodoni 72",Didot,serif;background:#f4f2ec;color:#0b0b0b;transform:rotate(-8deg)}
.L{left:440px;top:390px;font:italic 900 380px/1 "Avenir Next Condensed",Impact,sans-serif;background:#e5001c;color:#f4f2ec;outline:10px solid #f4f2ec;outline-offset:-5px;transform:rotate(7deg)}

<div class="l p">P</div><div class="l L">L</div></div></body></html>
